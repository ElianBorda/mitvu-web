# ============================================================
#  nginx.conf — Configuración para SPA con React Router
# ============================================================

server {
    # El puerto se reemplaza en tiempo de ejecución por docker-entrypoint.sh
    listen __PORT__;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache para assets con hash (Vite los genera con hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — todas las rutas no encontradas van al index.html
    # Esto es CRÍTICO para que React Router maneje /tutor/:id, /comision/:id, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica — ocultar versión de Nginx
    server_tokens off;

    # Headers de seguridad recomendados
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
